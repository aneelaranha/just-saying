<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Just Saying Collection</title>
<style>
  :root { --bg: #fff; --ink: #222; --muted: #8a8a8a; --gold: #a58b57; --line: #ece7dc; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; -webkit-text-size-adjust: 100%; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .grid button { all: unset; display: block; aspect-ratio: 1; background: #f6f4ef; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 28px; }
  .pager button { all: unset; display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 999px;
    border: 1px solid var(--gold); color: var(--gold); font-weight: 600; font-size: 15px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .pager button.next { background: var(--gold); color: #fff; }
  .pager button[disabled] { visibility: hidden; }
  .pager svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .count { font-size: 13px; color: var(--muted); text-align: center; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }

  .viewer { position: fixed; inset: 0; background: #fff; display: none; flex-direction: column; z-index: 10; touch-action: pan-y; }
  .viewer.open { display: flex; }
  .viewer .stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .viewer .stage img { width: 100%; max-width: 720px; max-height: 100%; object-fit: contain; transition: transform .2s ease; }
  .viewer .bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .viewer .bar button { all: unset; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    color: var(--ink); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .viewer .bar button[disabled] { opacity: .2; }
  .viewer .bar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .viewer .top { display: flex; justify-content: flex-end; padding: calc(8px + env(safe-area-inset-top)) 8px 0; }
  .viewer .top button { all: unset; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .viewer .top svg { width: 26px; height: 26px; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
  #share { visibility: hidden; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<div class="pager" id="pager">
  <button id="prev" aria-label="Previous page"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Previous</button>
  <div class="count" id="count"></div>
  <button id="next" class="next" aria-label="Next page">Next<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
</div>

<div class="viewer" id="viewer" role="dialog" aria-label="Just Saying image">
  <div class="top"><button id="close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="stage" id="stage"><img id="big" alt=""></div>
  <div class="bar">
    <button id="vprev" aria-label="Previous image"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button id="share" aria-label="Share"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
    <button id="vnext" aria-label="Next image"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
</div>

<script>
(function () {
  var PER = 50;
  var list = [], page = 0, cur = -1;
  var $ = function (id) { return document.getElementById(id); };
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  var d = new Date(), today = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

  function pages() { return Math.max(1, Math.ceil(list.length / PER)); }

  function render() {
    var start = page * PER, items = list.slice(start, start + PER), g = $('grid');
    g.innerHTML = '';
    if (!list.length) { g.outerHTML = '<div class="empty">No images yet.</div>'; return; }
    items.forEach(function (id, i) {
      var b = document.createElement('button');
      b.setAttribute('aria-label', 'Open image');
      var im = document.createElement('img');
      im.src = 'thumb/' + id + '.jpg'; im.alt = ''; im.loading = i < 12 ? 'eager' : 'lazy'; im.decoding = 'async';
      b.appendChild(im);
      b.onclick = function () { open(start + i); };
      g.appendChild(b);
    });
    $('prev').disabled = page === 0;
    $('next').disabled = page >= pages() - 1;
    $('count').textContent = 'Page ' + (page + 1) + ' of ' + pages();
    try { history.replaceState(null, '', '#page=' + (page + 1)); } catch (e) {}
  }
  function go(p) { page = Math.min(Math.max(p, 0), pages() - 1); render(); window.scrollTo(0, 0); }
  $('prev').onclick = function () { go(page - 1); };
  $('next').onclick = function () { go(page + 1); };

  function show(i) {
    cur = i;
    $('big').src = 'img/' + list[i] + '.jpg';
    $('vprev').disabled = i <= 0;
    $('vnext').disabled = i >= list.length - 1;
    [i - 1, i + 1].forEach(function (j) { if (j >= 0 && j < list.length) new Image().src = 'img/' + list[j] + '.jpg'; });
  }
  function open(i) { show(i); $('viewer').classList.add('open'); document.body.style.overflow = 'hidden'; }
  function close() {
    $('viewer').classList.remove('open'); document.body.style.overflow = '';
    var p = Math.floor(cur / PER); if (p !== page) go(p);
  }
  function step(n) { var j = cur + n; if (j >= 0 && j < list.length) show(j); }
  $('close').onclick = close;
  $('vprev').onclick = function () { step(-1); };
  $('vnext').onclick = function () { step(1); };
  document.addEventListener('keydown', function (e) {
    if (!$('viewer').classList.contains('open')) return;
    if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1);
  });
  var sx = null, sy = null;
  $('stage').addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  $('stage').addEventListener('touchend', function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
    else if (dy > 90 && Math.abs(dy) > Math.abs(dx)) close();
  });

  if (navigator.share) {
    $('share').style.visibility = 'visible';
    $('share').onclick = function () {
      var url = new URL('img/' + list[cur] + '.jpg', location.href).href;
      fetch(url).then(function (r) { return r.blob(); }).then(function (blob) {
        var file = new File([blob], 'Just Saying.jpg', { type: 'image/jpeg' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) return navigator.share({ files: [file], title: 'Just Saying' });
        return navigator.share({ title: 'Just Saying', url: url });
      }).catch(function () {});
    };
  }

  fetch('images.json?d=' + today, { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (ids) {
      list = ids.filter(function (id) { return id.slice(0, 10) <= today; });
      var m = /page=(\d+)/.exec(location.hash);
      page = m ? Math.min(Math.max(+m[1] - 1, 0), pages() - 1) : 0;
      render();
    })
    .catch(function () { $('grid').outerHTML = '<div class="empty">Couldn’t load the collection. Please check your connection.</div>'; });
})();
</script>
</body>
</html>
