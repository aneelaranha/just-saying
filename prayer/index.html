<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prayer Requests</title>
<style>html,body{margin:0;background:#fff}</style>
</head>
<body>
<!-- Browser preview of the app's Prayer Requests section. The app itself loads prayer.js directly.
     Add ?api=http://localhost:8787 to test against a local copy of the prayer API. -->
<div id="aa-prayer" data-links="web"></div>
<script>
  var api = new URLSearchParams(location.search).get('api');
  if (api) document.getElementById('aa-prayer').setAttribute('data-api', api);
</script>
<script src="prayer.js"></script>
</body>
</html>
